name = "pixelium-site"
compatibility_date = "2025-01-01"
# Pas de bloc `routes` ici : pixelium.win/www sont déjà attachés en Custom
# Domains (Workers Domains API, indépendant de ce fichier — vérifié via API
# Cloudflare). Un `routes` même en custom_domain:true fait passer wrangler
# par un check de conflit zone (`GET /zones/{zone}/workers/routes`) qui exige
# une permission Zone que le token CI (account-scoped) n'a pas → deploy
# cassé (constaté 24/07). `workers_dev=false` seul ne touche que l'endpoint
# account-level /subdomain, déjà couvert.
workers_dev = false

[assets]
directory = "./dist"

[[kv_namespaces]]
binding = "SESSION"
id = "c6b9d2a3e87549ad9169c88e11384683"

[[kv_namespaces]]
binding = "STATUS_KV"
id = "52300c6bc4a548af882ee63b6422a471"

[[kv_namespaces]]
binding = "STATS_KV"
id = "299a7b4537b049649736e23b84753a6a"

[[d1_databases]]
binding = "HISTORY_DB"
database_name = "pixelium-history"
database_id = "3b74f11d-4be8-42aa-b303-2885ba5b52a3"

# HISTORY_KEY: set via `wrangler secret put HISTORY_KEY` (not in [vars] — secrets override)

[ai]
binding = "AI"

# Rate limiting atomique (fix F-001, infra/homelab-infra#97) — fenêtre minute, anti-rafale.
# Le binding natif ne supporte que period 10/60s ; la fenêtre heure reste un
# compteur KV (course bornée par ce limiteur atomique → over-count négligeable).
[[ratelimits]]
name = "CHAT_RL"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 4
  period = 60
