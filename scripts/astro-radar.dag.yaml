# astro-radar — DAG Dagu (à installer sur CT 246). Couche de DÉCLENCHEMENT only :
# le cerveau (diff de versions + scan des surfaces breaking) vit dans le repo du site
# (scripts/astro-radar.mjs). Ici on se contente de pull, lancer, et router les briefs.
#
# Prérequis déjà en place : Hermes/Dagu clonent pixelium-site (/root/pixelium-site),
# les feeds Astro sont dans FreshRSS, Hermes a un cron veille-quotidienne.
# → ce DAG ajoute le lane CIBLÉ "upgrade brief" par-dessus l'awareness passive.
#
# MULTI-REPO depuis le 2026-07-29 (`pixelium-site#71`) : le radar scanne le site ET
# le blog. Le blog doit donc être cloné À CÔTÉ du site sur l'hôte du DAG — sinon le
# radar le signale comme "cible injoignable" (bruyant par conception : une cible
# muette est exactement le bug qu'on corrige).
#
# ⚠️ YAML : les étapes shell utilisent `command: bash` + `script: |` (scalaire
# LITTÉRAL). L'ancienne forme `command: bash -c '…'` étalée sur plusieurs lignes
# ne parsait pas — un `#` en début de ligne y ferme le scalaire plain et le reste
# du bloc devient une clé inattendue. Le fichier était invalide depuis l'origine
# (constaté 2026-07-29 en le passant à un parseur, pas en le relisant).
#
# ⚠️ À valider en session homelab contre les conventions Dagu RÉELLES de CT 246
# (chemins, secret ntfy/Telegram, et surtout les clés `continueOn`/`script` : cf
# `infra/homelab#143`, où un `continueOn` avait passé le reload puis cassé au
# dispatch — un parse propre ne prouve pas qu.un DAG s.exécute).

schedule: "30 8 * * *"   # 08h30, après release-watch (8h) ; heures creuses

env:
  - SITE_DIR: /root/pixelium-site
  - BLOG_DIR: /root/blog-pixelium

steps:
  - name: pull-site
    command: bash
    script: |
      cd "$SITE_DIR" && git pull --quiet --ff-only

  # Le blog n'est pas forcément déjà cloné sur le CT : clone au premier run,
  # pull ensuite. Un échec ici ne doit pas empêcher le scan du site — le radar
  # signalera de lui-même la cible manquante.
  - name: pull-blog
    command: bash
    script: |
      if [ -d "$BLOG_DIR/.git" ]; then
        cd "$BLOG_DIR" && git pull --quiet --ff-only
      else
        git clone --quiet --depth 1 "$FORGEJO_URL/pixelium/blog-pixelium.git" "$BLOG_DIR"
      fi
    continueOn:
      failure: true

  - name: radar
    depends:
      - pull-site
      - pull-blog
    command: bash
    script: |
      cd "$SITE_DIR"
      ASTRO_RADAR_BLOG_DIR="$BLOG_DIR" node scripts/astro-radar.mjs --json
    output: RADAR_JSON
    continueOn:
      exitCode: [0, 10]   # 10 = il y a du neuf, ce n'est pas une erreur

  - name: route-brief
    depends:
      - radar
    # Ne notifier QUE s'il y a quelque chose à faire (shouldAlert).
    preconditions:
      - condition: "echo '${RADAR_JSON}' | jq -r .shouldAlert"
        expected: "true"
    command: bash
    script: |
      # Le --json du step radar porte tout : .brief (markdown, toutes cibles) et
      # .issues[] (une spec par repo : repo/title/labels/body). Pas besoin de
      # relancer le script.
      JSON="${RADAR_JSON}"

      # 1) ping humain (ntfy ; ou router vers Telegram via Hermes)
      echo "$JSON" | jq -r .brief | ntfy publish --title "Astro radar" pixelium-veille

      # 2) Tier 2 — une issue Forgejo PAR REPO (canal fiable cross-host que la
      #    session web relit via le label astro-upgrade).
      #    Idempotence « préfixe + repo » : le titre porte le nom du repo
      #    (`[astro-radar] blog-pixelium — …`) ET on ne cherche le doublon que
      #    DANS le repo concerné. Tester le seul préfixe `[astro-radar]` sur un
      #    dépôt unique ferait qu'une issue ouverte sur le site bâillonnerait
      #    celle du blog — le mode de panne de pixelium-site#71.
      echo "$JSON" | jq -c '.issues[]' | while read -r ISSUE; do
        REPO=$(echo "$ISSUE" | jq -r .repo)
        TITLE=$(echo "$ISSUE" | jq -r .title)
        EXISTS=$(curl -s -H "Authorization: token $FORGEJO_TOKEN" \
          "$FORGEJO_URL/api/v1/repos/$REPO/issues?state=open&type=issues" \
          | jq -r --arg t "$TITLE" 'map(select(.title==$t)) | length')
        if [ "$EXISTS" = "0" ]; then
          echo "$ISSUE" | jq '{title: .title, body: .body, labels: []}' \
            | curl -s -X POST -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" -d @- \
              "$FORGEJO_URL/api/v1/repos/$REPO/issues" > /dev/null
        fi
      done

    # NB labels : l'API Forgejo veut des IDs de label, pas des noms — la session homelab
    # résout astro-upgrade/dependencies en IDs (les créer une fois sur CHAQUE repo, les
    # IDs diffèrent d'un dépôt à l'autre) puis les passe dans le POST. Laissé vide ici.
    #
    # NB namespace : les repos vivent sous l'org `pixelium` depuis la réorg de juillet
    # (ex-`uzer/…`). Forgejo redirige encore l'ancien chemin (vérifié : 200), mais le
    # radar écrit désormais le nom complet dans `.issues[].repo` — plus de repo en dur.
