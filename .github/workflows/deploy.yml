name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Rebuild quotidien : re-fetch toutes les données build-time (HTB, Root-Me,
  # statuts PR /contributions) → chaque page se rafraîchit seule, sans commit.
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC daily (avant le Freshness guard de 06:17)
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Assert workers_dev disabled
        # Déplacé depuis ci.yml (2026-07-30, infra/homelab#181) : c'était le SEUL
        # contrôle de ci.yml absent de ce job. Or ci.yml et deploy.yml se déclenchent
        # en PARALLÈLE sur push — le CI ne conditionnait donc rien, il constatait
        # après coup. Un chaînage `workflow_run` aurait laissé le rebuild `schedule`
        # (05:00 UTC) et `workflow_dispatch` hors contrôle : un step dans le job
        # couvre TOUS les déclencheurs, et échoue avant `npm ci` (fail fast).
        # Régression visée : *.workers.dev contourne les protections de la zone
        # pixelium.win (audit sécu Grok #18, P1).
        run: grep -qE '^workers_dev\s*=\s*false' wrangler.toml

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12' # aligné sur engines >=22.12.0 (package.json)
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # /contributions : synchro statut des PR au build (lecture publique GitHub).
          # github.token (moindre privilège, auto-fourni) suffit — évite le
          # rate-limit anonyme (60/h) sans exposer le secret repo plus large.
          # HTB_API_TOKEN/ROOTME_API_KEY/ROOTME_UID/FORGEJO_TOKEN retirés : plus
          # lus par le build depuis le passage à l'architecture KV (cf CLAUDE.md,
          # confirmé par grep — aucune référence dans src/), moins de blast
          # radius si ce step est compromis (audit CI Grok, pixelium/web#19, P2).
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert deploy artefact
        run: test -f dist/server/wrangler.json && test -d dist/client

      - name: No secrets in dist
        run: |
          if grep -rE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{16,}|BEGIN [A-Z ]*PRIVATE' dist; then
            echo "Possible secret material in dist" >&2
            exit 1
          fi

        # @astrojs/cloudflare v14 scinde la sortie en dist/client (assets) +
        # dist/server (worker) et génère dist/server/wrangler.json (bindings
        # fusionnés depuis wrangler.toml + chemins résolus). On déploie cette
        # config générée — un `wrangler deploy` nu lirait le wrangler.toml racine
        # (./dist, sans main) et publierait les assets sans le Worker SSR.
      - run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          # F-003 (infra/homelab-infra#97, fait 2026-06-07) : token scopé `pixelium-site-ci` —
          # Workers Scripts/KV/D1 Write + Workers AI Read + Account Settings Read
          # + User Details/Memberships Read. Validé en dry-run avant bascule.
          # Rollback : remettre CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL (secrets conservés).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke production
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null https://pixelium.win/
          curl -sI https://pixelium.win/ | grep -qi 'strict-transport-security'
          # wrangler deploy "success" ne garantit pas que CHAQUE colo Cloudflare
          # sert déjà la nouvelle version instantanément — constaté 24/07 :
          # colo ORD répondait encore avec le sha du déploiement précédent
          # juste après un deploy réussi, colo CDG avait déjà la bonne version
          # quelques secondes plus tard. Retry plutôt qu'un sleep fixe.
          #
          # ⚠️ Fenêtre portée de 25 s à 90 s le 2026-07-30 : DEUX runs consécutifs
          # ont échoué ici alors que le déploiement était bon (colo IAD servait
          # encore le sha précédent après 25 s ; la prod servait le bon sha peu
          # après). Un garde-fou qui rougit à tort est pire qu'inutile — il
          # entraîne à ignorer les rouges, et c'est précisément ce qui a failli
          # laisser passer deux échecs ce jour-là. On garde le contrôle STRICT
          # (le job casse si le sha n'arrive jamais : il a détecté un vrai cas le
          # 24/07), on lui donne seulement le temps que la propagation demande.
          for i in $(seq 1 18); do
            if curl -fsS https://pixelium.win/api/deployment | tee /tmp/dep.json | grep -q "${GITHUB_SHA:0:7}"; then
              echo "sha confirmé en prod à la tentative $i"
              exit 0
            fi
            echo "tentative $i/18 : sha pas encore propagé sur ce colo, retry dans 5s"
            sleep 5
          done
          echo "sha jamais confirmé après 18 tentatives (90s)" >&2
          cat /tmp/dep.json >&2
          exit 1

      - name: Notify Telegram on failure
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Message de commit = texte libre non maîtrisé : tronqué + caractères
          # Markdown (legacy) échappés pour ne pas casser le parse_mode Telegram
          # ni le format de la requête (--data-urlencode plutôt que -d brut).
          SAFE_MSG=$(printf '%s' "$COMMIT_MSG" | cut -c1-300 | sed -e 's/[_*`[]/\\&/g')
          TEXT=$(printf '⚠️ *Deploy pixelium.win FAILED*\n\nCommit: `%s`\nMessage: %s\nVoir le run: %s' \
            "${GITHUB_SHA::7}" "$SAFE_MSG" "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=Markdown \
            --data-urlencode "text=${TEXT}"
