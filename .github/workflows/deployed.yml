name: Deployed check

# Compares the numbers PRODUCTION actually serves against the live KV, and flags a
# deployment that stopped being rebaked. This is the guard that was missing on
# 2026-08-27, when the home page served 115 flags against a KV that said 117 while
# both existing guards stayed green (issue #136):
#   - Freshness guard compares the SOURCE to the KV   → green, the source was right
#   - headers-check    compares served HEADERS        → green, headers were right
# Nobody looked at the served HTML. DynNum bakes at build time and never hydrates,
# so the numbers are frozen between rebakes — and that day's rebake was simply
# skipped, because GitHub `schedule` is best-effort.
#
# Timing matters here. Deploy runs at 05:00 UTC (in practice ~05:25). We check at
# 09:00 with a 26 h threshold, so:
#   - normal day       → build is 2-4 h old   → pass
#   - rebake skipped   → build is ~28 h old   → STALE DEPLOY
# A tighter threshold would fire every time GitHub delays the deploy cron by a
# couple of hours, which is exactly how a guard earns being ignored.
#
# Does NOT gate deploys: it audits what is already public.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily, ~4 h after the deploy cron
  workflow_dispatch: {}
  # No `push` trigger on purpose: this guard reads production, not the working tree.
  # Running it on a commit would audit the PREVIOUS deployment and report on code
  # that is not live yet.

jobs:
  deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true # suit la dernière 22.x, pas le cache du runner (astro ≥ 7.4.2 : node ≥ 22.23.4)

      - name: Check what production serves
        run: |
          set -o pipefail
          node scripts/check-deployed.mjs --max-age-hours 26 2>&1 | tee deployed-output.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo '### Deployed check'
            echo
            echo '```'
            cat deployed-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate a real production problem
        # Only when the PUBLIC site is wrong — a stale deployment or numbers baked from
        # the fallback snapshot. A gap with the LIVE KV is not paged: counters climb
        # between the rebake and this run, which GitHub delays to 13:40-17:30 UTC —
        # paging on it fired one day in two for nothing (issue #154).
        # A GUARD BLIND result means this script can no longer
        # see what it audits (markup changed, sitemap unreadable): that needs a code
        # fix, not a production alert, and paging on it would train us to ignore it.
        #
        # Since 2026-10-25 this step only writes an `::error title=<MARKER>` annotation:
        # the DAG `gh-actions-watch` (CT 246, infra/homelab) reads it through the public
        # API, without any secret, and publishes on ntfy — high priority with a marker,
        # low priority without. Telegram, the former channel, is dead since 23/10.
        if: failure()
        run: |
          if grep -qE 'FALLBACK BAKE|STALE DEPLOY' deployed-output.txt; then
            MARKER=$(grep -oE 'FALLBACK BAKE|STALE DEPLOY' deployed-output.txt | sort -u | paste -sd, -)
            echo "::error title=${MARKER}::pixelium.win sert des chiffres faux : rebake quotidien sauté, ou build cuit depuis le snapshot de secours (KV injoignable)."
          elif grep -q 'ORPHAN KEY' deployed-output.txt; then
            # Le KV a perdu une clé affichée (21/10 : les 3 clés Root-Me, 63 → 60) : la page
            # montre sa valeur de secours. Panne du producteur kv-push, pas du garde ; avant
            # ce cas, elle tombait dans « garde aveugle » et ne prévenait personne.
            KEYS=$(grep -oE 'KV has no key "[^"]+"' deployed-output.txt | sort -u | grep -oE '"[^"]+"' | tr -d '"' | paste -sd, -)
            echo "::error title=ORPHAN KEY::${KEYS} absente(s) du KV — la page affiche la valeur de secours. Vérifier le producteur kv-push (CT 246)."
          else
            echo "Échec sans marqueur FALLBACK BAKE / STALE DEPLOY / ORPHAN KEY (garde aveugle) — pas de notif, corriger check-deployed.mjs."
          fi
