name: Freshness guard

# Fails if a hardcoded number in the source drifted away from the live KV
# (/api/stats). Runs daily — KV moves over time, so this catches slow drift
# even without a code change — plus on demand. Does NOT gate deploys.
on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    # Le guard fait TROIS passes, et `paths` doit couvrir les trois :
    #   1. CHECKS — des littéraux épinglés dans une poignée de fichiers ;
    #   2. le sweep « orphan stats » — qui lit TOUT `src/**` (.astro/.ts) pour
    #      vérifier que chaque <DynNum stat="x"> / StatsBar { stat: 'x' } existe
    #      bien dans le KV ;
    #   3. le sweep inverse « unread KV keys » — chaque clé du KV doit être lue
    #      quelque part dans `src/**`, ou déclarée sans affichage. Une clé ajoutée
    #      côté kv-push, sans commit ici, est vue par le cron du lendemain.
    # Lister les fichiers de CHECKS un par un couvrait la passe 1 mais laissait la
    # passe 2 aveugle : ajouter un <DynNum> sur une page non listée (projets.astro,
    # par ex.) pouvait introduire une stat orpheline sans rien déclencher avant le
    # cron du lendemain. D'où `src/**`, qui suit la passe la plus large.
    paths:
      - 'src/**'
      - 'public/humans.txt'
      - 'scripts/audit-freshness.mjs'

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run freshness check
        run: |
          set -o pipefail
          node scripts/audit-freshness.mjs 2>&1 | tee freshness-output.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo '### Freshness guard'
            echo
            echo '```'
            cat freshness-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram on real drift
        # Sur DRIFT réel ou ORPHAN STATS (dans les deux cas le site affiche un
        # chiffre faux en public) — pas sur un check cassé/périmé (regex/fichier),
        # qui a besoin d'un fix de code, pas d'une alerte de production.
        if: failure()
        run: |
          if grep -q 'FRESHNESS DRIFT' freshness-output.txt; then
            TEXT=$(printf '⚠️ *Freshness drift détecté sur pixelium.win*\n\nUn chiffre en dur a divergé du KV live.\nVoir le run : %s' \
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode=Markdown \
              --data-urlencode "text=${TEXT}"
          elif grep -q 'ORPHAN STATS' freshness-output.txt; then
            # Le KV ne publie plus une stat lue par une page (25/10 : les 3 clés Root-Me,
            # comme le 21/10 côté Deployed check) : la page sert sa valeur de secours.
            # Panne du producteur kv-push, pas du garde — même alerte que `ORPHAN KEY`.
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            KEYS=$(grep -oE "stat '[^']+' absent" freshness-output.txt | sort -u | grep -oE "'[^']+'" | tr -d "'" | sed 's/.*/`&`/' | paste -sd, -)
            TEXT=$(printf '⚠️ *pixelium.win : stat(s) absente(s) du KV*\n\n%s — la page affiche la valeur de secours. Vérifier le producteur kv-push (CT 246).\nVoir le run : %s' "$KEYS" "$RUN_URL")
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode=Markdown \
              --data-urlencode "text=${TEXT}"
          else
            echo "Échec sans marqueur FRESHNESS DRIFT / ORPHAN STATS (check cassé/périmé) — pas de notif, corriger audit-freshness.mjs."
          fi
